<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource Booking Portal v2</title>
<style>
body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 16px; background: #f4f6f8; color: #222; }
h1 { margin-bottom: 4px; }
h2 { margin-top: 0; }
.sub { color: #666; margin-top: 0; }
.stats { display: flex; gap: 12px; margin: 16px 0; }
.stat { flex: 1; background: #fff; border-radius: 8px; padding: 12px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.stat b { display: block; font-size: 28px; }
.card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
input, select, button { padding: 8px; margin: 4px 4px 4px 0; font-size: 14px; }
button { cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px; border-bottom: 1px solid #ddd; }
.msg { padding: 8px; border-radius: 6px; margin-bottom: 12px; display: none; }
.msg.ok { display: block; background: #e3f6e8; color: #17692e; }
.msg.err { display: block; background: #fde8e8; color: #9b1c1c; }
.del { color: #9b1c1c; }
</style>
</head>
<body>
<h1>Resource Booking Portal v2</h1>
<p class="sub">Book a shared resource for a date. One resource cannot be booked twice on the same day.</p>
<div id="msg" class="msg"></div>
<div class="stats">
<div class="stat"><b id="s-resources">-</b>Resources</div>
<div class="stat"><b id="s-bookings">-</b>Bookings</div>
<div class="stat"><b id="s-upcoming">-</b>Upcoming</div>
</div>
<div class="card">
<h2>New booking</h2>
<select id="b-resource"></select>
<input id="b-name" placeholder="Your name" maxlength="100">
<input id="b-date" type="date">
<input id="b-note" placeholder="Note (optional)" maxlength="300">
<button id="b-add">Book</button>
</div>
<div class="card">
<h2>Bookings</h2>
<table>
<thead><tr><th>Resource</th><th>Name</th><th>Date</th><th>Note</th><th></th></tr></thead>
<tbody id="b-list"></tbody>
</table>
</div>
<div class="card">
<h2>Resources</h2>
<table>
<thead><tr><th>Name</th><th>Description</th><th></th></tr></thead>
<tbody id="r-list"></tbody>
</table>
<input id="r-name" placeholder="New resource name" maxlength="100">
<input id="r-desc" placeholder="Description" maxlength="300">
<button id="r-add">Add resource</button>
</div>
<script>
function $(id) { return document.getElementById(id); }

function show(text, ok) {
  var m = $("msg");
  m.textContent = text;
  m.className = "msg " + (ok ? "ok" : "err");
}

async function api(method, path, body) {
  var opts = { method: method, headers: {} };
  if (body) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  var res = await fetch("/api" + path, opts);
  var data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { throw new Error(data.error || ("request failed (" + res.status + ")")); }
  return data;
}

function cell(tr, text) {
  var td = document.createElement("td");
  td.textContent = text;
  tr.appendChild(td);
}

function delButton(tr, label, handler) {
  var td = document.createElement("td");
  var b = document.createElement("button");
  b.textContent = label;
  b.className = "del";
  b.addEventListener("click", handler);
  td.appendChild(b);
  tr.appendChild(td);
}

async function loadAll() {
  try {
    var results = await Promise.all([api("GET", "/stats"), api("GET", "/resources"), api("GET", "/bookings")]);
    var stats = results[0], resources = results[1], bookings = results[2];
    $("s-resources").textContent = stats.resources;
    $("s-bookings").textContent = stats.bookings;
    $("s-upcoming").textContent = stats.upcoming;
    renderResources(resources);
    renderBookings(bookings);
  } catch (e) {
    show("Could not load data: " + e.message, false);
  }
}

function renderResources(resources) {
  var sel = $("b-resource");
  var keep = sel.value;
  sel.textContent = "";
  var tbody = $("r-list");
  tbody.textContent = "";
  resources.forEach(function (r) {
    var opt = document.createElement("option");
    opt.value = r.id;
    opt.textContent = r.name;
    sel.appendChild(opt);
    var tr = document.createElement("tr");
    cell(tr, r.name);
    cell(tr, r.description);
    delButton(tr, "Delete", function () { removeResource(r); });
    tbody.appendChild(tr);
  });
  if (keep) { sel.value = keep; }
}

function renderBookings(bookings) {
  var tbody = $("b-list");
  tbody.textContent = "";
  bookings.forEach(function (b) {
    var tr = document.createElement("tr");
    cell(tr, b.resource);
    cell(tr, b.booked_by);
    cell(tr, b.booking_date);
    cell(tr, b.note);
    delButton(tr, "Cancel", function () { cancelBooking(b); });
    tbody.appendChild(tr);
  });
}

async function addBooking() {
  try {
    await api("POST", "/bookings", {
      resource_id: parseInt($("b-resource").value, 10),
      booked_by: $("b-name").value,
      booking_date: $("b-date").value,
      note: $("b-note").value
    });
    show("Booking created", true);
    $("b-note").value = "";
    await loadAll();
  } catch (e) {
    show(e.message, false);
  }
}

async function cancelBooking(b) {
  if (!confirm("Cancel booking of " + b.resource + " on " + b.booking_date + "?")) { return; }
  try {
    await api("DELETE", "/bookings/" + b.id);
    show("Booking cancelled", true);
    await loadAll();
  } catch (e) {
    show(e.message, false);
  }
}

async function addResource() {
  try {
    await api("POST", "/resources", { name: $("r-name").value, description: $("r-desc").value });
    show("Resource added", true);
    $("r-name").value = "";
    $("r-desc").value = "";
    await loadAll();
  } catch (e) {
    show(e.message, false);
  }
}

async function removeResource(r) {
  if (!confirm("Delete " + r.name + "? All its bookings will be deleted too.")) { return; }
  try {
    await api("DELETE", "/resources/" + r.id);
    show("Resource deleted", true);
    await loadAll();
  } catch (e) {
    show(e.message, false);
  }
}

$("b-add").addEventListener("click", addBooking);
$("r-add").addEventListener("click", addResource);
var d = new Date();
d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
$("b-date").value = d.toISOString().slice(0, 10);
$("b-date").min = $("b-date").value;
loadAll();
</script>
</body>
</html>
